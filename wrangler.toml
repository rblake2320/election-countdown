name = "election-countdown"
pages_build_output_dir = "public"
compatibility_date = "2026-05-14"

# Production (and local `wrangler pages dev`).
[vars]
ENVIRONMENT = "production"
# Pages on these hosts redirect to the canonical domain (functions/_middleware.js).
CANONICAL_HOST = "electionclock.com"
REDIRECT_HOSTS = "election-countdown-38g.pages.dev,www.electionclock.com"

[[d1_databases]]
binding = "DB"
database_name = "election-countdown"
database_id = "47185562-ab95-41e9-a184-418ec3b0c1d0"

# Preview deployments (e.g. `wrangler pages deploy --branch staging`) use a separate database,
# so staging and load tests never touch production data. Pages requires every non-inheritable
# key (vars, d1_databases, ...) to be redefined here once any one is.
[env.preview.vars]
ENVIRONMENT = "staging"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "election-countdown-staging"
database_id = "c976026a-7cdd-4ee7-97d9-2e3d01c72843"
