name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" covers a stacked PR being retargeted to main.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run check
      - run: npm run build
      - name: Committed public/ matches a fresh build
        run: |
          git status --porcelain public
          git diff --exit-code --stat public || { echo "::error::public/ is stale: run 'npm run build' and commit it"; exit 1; }
          test -z "$(git status --porcelain public)" || { echo "::error::public/ has untracked build files: run 'npm run build' and commit"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium
      # Fast, visible failure if the local Cloudflare runtime cannot start on the runner.
      - name: Smoke-start wrangler pages dev
        run: |
          npx wrangler --version
          npx wrangler pages dev --port 8790 --persist-to /tmp/smoke --binding ADMIN_SECRET=smoke-admin-secret-0123456789abcdef0123 IP_HASH_SECRET=smoke > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 45); do curl -s -o /dev/null -w "%{http_code}" http://localhost:8790/api/health | grep -q 200 && break; sleep 2; done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8790/api/health || true)
          echo "health status: $status"; cat /tmp/smoke.log
          kill %1 || true
          test "$status" = "200"
      - run: npm run test:e2e
