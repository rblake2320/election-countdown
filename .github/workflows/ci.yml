name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" covers a stacked PR being retargeted to main.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run check
      - run: npm run build
      - name: Committed public/ matches a fresh build
        run: |
          git status --porcelain public
          git diff --exit-code --stat public || { echo "::error::public/ is stale: run 'npm run build' and commit it"; exit 1; }
          test -z "$(git status --porcelain public)" || { echo "::error::public/ has untracked build files: run 'npm run build' and commit"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
