<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex"><title>Live election countdown</title>
  <link rel="stylesheet" href="/live-avatar.css">
</head>
<body>
  <main id="avatar" role="img" aria-label="Loading live countdown" data-status="loading">
    <div class="content">
      <span id="eyebrow">ELECTION</span>
      <strong id="days">—</strong><span id="unit">CONNECTING</span>
      <span id="clock">--:--:--</span>
      <span id="zone"></span><span id="status">CONNECTING</span>
    </div>
  </main>
  <script src="/live-avatar.js"></script>
</body>
</html>
